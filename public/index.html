<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Panel de Activacion</title>
  <style>
    body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}
    .wrap{max-width:1180px;margin:auto;padding:24px}
    .card{background:white;border-radius:12px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #0001}
    input,select,button{padding:10px;border-radius:8px;border:1px solid #ccd;margin:4px}
    button{background:#1e7f4f;color:white;border:0;cursor:pointer}
    button.danger{background:#b00020}
    button.secondary{background:#334155}
    table{width:100%;border-collapse:collapse}
    td,th{border-bottom:1px solid #eee;padding:8px;text-align:left;vertical-align:top}
    .blocked{color:#b00020;font-weight:bold}
    .actions{display:flex;gap:6px;flex-wrap:wrap}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px}
    .small{font-size:12px;color:#64748b}
  </style>
</head>
<body>
<div class="wrap">
  <h1>Panel de Activacion</h1>

  <div class="card">
    <h2>Acceso admin</h2>
    <input id="pass" type="password" placeholder="Contrasena admin">
    <button onclick="load()">Entrar</button>
  </div>

  <div class="card">
    <h2>Crear licencia</h2>
    <div class="grid">
      <input id="name" placeholder="Nombre cliente">
      <input id="phone" placeholder="Telefono">
      <input id="months" type="number" value="12" placeholder="Meses">
      <input id="devices" type="number" value="1" placeholder="Dispositivos">
    </div>
    <button onclick="createLicense()">Generar clave</button>
    <p id="created"></p>
  </div>

  <div class="card">
    <h2>Licencias</h2>
    <table>
      <thead>
        <tr>
          <th>Clave</th>
          <th>Cliente</th>
          <th>Estado</th>
          <th>Vence</th>
          <th>Dispositivos</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
const pass = document.getElementById('pass');
const rows = document.getElementById('rows');
const created = document.getElementById('created');

const api = (url, opts = {}) => fetch(url, {
  ...opts,
  headers: {
    'Content-Type': 'application/json',
    'x-admin-password': pass.value,
    ...(opts.headers || {})
  }
}).then(r => r.json());

function esc(v) {
  return String(v || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function dateInput(iso) {
  if (!iso) return '';
  return new Date(iso).toISOString().slice(0, 10);
}

async function load() {
  const r = await api('/api/admin/licenses');
  if (!r.ok) { alert(r.message); return; }
  rows.innerHTML = r.licenses.map(l => `
    <tr>
      <td><b>${esc(l.key)}</b><div class="small">${esc(l.businessName || '')}</div></td>
      <td>
        <input id="name-${l.key}" value="${esc(l.customerName)}" placeholder="Cliente"><br>
        <input id="phone-${l.key}" value="${esc(l.customerPhone)}" placeholder="Telefono">
      </td>
      <td>
        <select id="status-${l.key}" class="${l.status === 'blocked' ? 'blocked' : ''}">
          <option value="active" ${l.status === 'active' ? 'selected' : ''}>active</option>
          <option value="blocked" ${l.status === 'blocked' ? 'selected' : ''}>blocked</option>
        </select>
      </td>
      <td><input id="expires-${l.key}" type="date" value="${dateInput(l.expiresAt)}"></td>
      <td>
        <input id="devices-${l.key}" type="number" min="1" value="${l.maxDevices || 1}" style="width:70px">
        <div class="small">Usados: ${(l.devices || []).length}/${l.maxDevices || 1}</div>
      </td>
      <td>
        <div class="actions">
          <button onclick="saveLicense('${l.key}')">Guardar</button>
          <button class="secondary" onclick="clearDevices('${l.key}')">Liberar dispositivos</button>
          <button class="danger" onclick="deleteLicense('${l.key}')">Borrar</button>
        </div>
      </td>
    </tr>
  `).join('');
}

async function createLicense() {
  const r = await api('/api/admin/licenses', {
    method: 'POST',
    body: JSON.stringify({
      customerName: name.value,
      customerPhone: phone.value,
      months: months.value,
      maxDevices: devices.value
    })
  });
  if (!r.ok) { alert(r.message); return; }
  created.innerHTML = 'Clave creada: <b>' + esc(r.license.key) + '</b>';
  load();
}

async function saveLicense(key) {
  const r = await api('/api/admin/update', {
    method: 'POST',
    body: JSON.stringify({
      licenseKey: key,
      customerName: document.getElementById('name-' + key).value,
      customerPhone: document.getElementById('phone-' + key).value,
      status: document.getElementById('status-' + key).value,
      expiresAt: document.getElementById('expires-' + key).value,
      maxDevices: document.getElementById('devices-' + key).value
    })
  });
  if (!r.ok) alert(r.message);
  load();
}

async function clearDevices(key) {
  if (!confirm('Esto libera los dispositivos activados para que la licencia pueda usarse otra vez.')) return;
  const r = await api('/api/admin/update', {
    method: 'POST',
    body: JSON.stringify({ licenseKey: key, clearDevices: true })
  });
  if (!r.ok) alert(r.message);
  load();
}

async function deleteLicense(key) {
  if (!confirm('Seguro que quieres borrar esta licencia?')) return;
  const r = await api('/api/admin/delete', {
    method: 'POST',
    body: JSON.stringify({ licenseKey: key })
  });
  if (!r.ok) alert(r.message);
  load();
}
</script>
</body>
</html>
