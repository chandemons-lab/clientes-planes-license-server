<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de Activación</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:white;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 10px 30px #0001}input,button{padding:12px;border-radius:10px;border:1px solid #ccd;margin:6px}button{background:#1e7f4f;color:white;border:0;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #eee;padding:10px;text-align:left}.blocked{color:#b00020;font-weight:bold}</style></head><body><div class="wrap"><h1>Panel de Activación</h1><div class="card"><h2>Acceso admin</h2><input id="pass" type="password" placeholder="Contraseña admin"><button onclick="load()">Entrar</button></div><div class="card"><h2>Crear licencia</h2><input id="name" placeholder="Nombre cliente"><input id="phone" placeholder="Teléfono"><input id="months" type="number" value="12" placeholder="Meses"><input id="devices" type="number" value="1" placeholder="Dispositivos"><button onclick="createLicense()">Generar clave</button><p id="created"></p></div><div class="card"><h2>Licencias</h2><table><thead><tr><th>Clave</th><th>Cliente</th><th>Estado</th><th>Vence</th><th>Dispositivos</th><th>Acción</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>
const api=(url,opts={})=>fetch(url,{...opts,headers:{'Content-Type':'application/json','x-admin-password':document.getElementById('pass').value,...(opts.headers||{})}}).then(r=>r.json());
async function load(){const r=await api('/api/admin/licenses'); if(!r.ok){alert(r.message);return} rows.innerHTML=r.licenses.map(l=>`<tr><td><b>${l.key}</b></td><td>${l.customerName||''}<br>${l.customerPhone||''}</td><td class="${l.status==='blocked'?'blocked':''}">${l.status}</td><td>${new Date(l.expiresAt).toLocaleDateString()}</td><td>${l.devices.length}/${l.maxDevices}</td><td><button onclick="toggle('${l.key}','${l.status}')">${l.status==='blocked'?'Desbloquear':'Bloquear'}</button></td></tr>`).join('')}
async function createLicense(){const r=await api('/api/admin/licenses',{method:'POST',body:JSON.stringify({customerName:name.value,customerPhone:phone.value,months:months.value,maxDevices:devices.value})}); if(!r.ok){alert(r.message);return} created.innerHTML='Clave creada: <b>'+r.license.key+'</b>'; load()}
async function toggle(key,status){await api('/api/admin/'+(status==='blocked'?'unblock':'block'),{method:'POST',body:JSON.stringify({licenseKey:key})}); load()}
</script></body></html>
